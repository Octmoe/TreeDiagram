name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frozen dependencies
        run: npm ci

      - name: Check release metadata
        run: npm run release:check

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm test

      - name: Build source
        run: npm run build

      - name: Audit production dependencies
        run: npm run audit:prod

  browser:
    name: Browser flows (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frozen dependencies
        run: npm ci

      - name: Build source
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run browser tests
        run: npm run test:e2e

  source-install:
    name: Source install smoke test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Prepare source installation without changing Codex
        run: npm run install:codex -- --no-codex

      - name: Confirm generated bindings remain untracked
        shell: pwsh
        run: |
          if (git status --short) {
            git status --short
            throw 'Source installation changed tracked files.'
          }
